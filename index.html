<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Yu-Gi-Oh! LP Tracker</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <style>
    :root{--bg:#000;--text:#fff;--muted:#8a8a8a;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;--gray:#161616;--panel:#000;--press:brightness(1.22)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    body{overscroll-behavior:none}
    button,input{font:inherit}
    button{transition:transform .08s ease,filter .08s ease,opacity .12s ease,background-color .12s ease,color .12s ease,box-shadow .16s ease}
    button:active{transform:scale(.95);filter:var(--press)}
    button:disabled{opacity:.35}
    .app{height:100dvh;max-width:560px;margin:0 auto;padding:8px;gap:8px;display:grid;grid-template-rows:1fr auto 1fr;background:#000}
    .panel,.center,.sheet,.settings,.history-sheet{background:var(--panel);border:none;box-shadow:none}
    .panel{border-radius:32px;overflow:hidden;min-height:0}
    .panel-inner{height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:14px;transition:transform .2s ease;transform-origin:center center}
    .rotated{transform:rotate(180deg)}
    .head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .label{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
    .name-input{background:transparent;color:#fff;border:none;outline:none;font-size:16px;font-weight:700;padding:0;margin:0 0 8px 0;width:100%}
    .lp{font-size:clamp(56px,15vw,96px);font-weight:800;letter-spacing:-.05em;line-height:.9;font-variant-numeric:tabular-nums;transform-origin:center center}
    .lp.bump{animation:lpBump .26s ease}
    @keyframes lpBump{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
    .controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:end}
    .icon-btn,.mini-btn,.action-btn,.match-clock,.ghost-btn,.start-input,.apply-btn,.time-input,.circle-btn,.cancel-btn,.confirm-btn,.radial-item{border:none;outline:none;border-radius:999px}
    .icon-btn,.mini-btn,.action-btn,.ghost-btn,.circle-btn,.radial-item{color:#fff;background:var(--gray)}
    .icon-btn,.mini-btn,.action-btn{display:grid;place-items:center}
    .icon-btn svg,.mini-btn svg,.action-btn svg{width:24px;height:24px;display:block}
    .icon-btn{width:46px;height:46px}
    .action-btn{height:min(20vw,96px);aspect-ratio:1/1;width:100%;max-width:96px;justify-self:center;font-size:34px;font-weight:800}
    .minus{background:var(--red);color:#fff}
    .plus{background:var(--green);color:#04130a}
    .actions-open{background:#0b0b0b;color:var(--blue);box-shadow:0 0 0 2px rgba(59,130,246,.16) inset}
    .mini-btn{min-height:58px;padding:0;font-size:20px;font-weight:700;background:#111}
    .undo{background:var(--blue);color:#fff}
    .redo{background:#2a2a2a;color:#fff}
    .settings-btn,.history-btn,.reset-btn{background:#141414}.reset-btn{width:64px;height:64px;min-height:64px}
    .redo.disabled,.undo.disabled{opacity:.35}
    .center{padding:10px;display:grid;gap:8px;grid-template-columns:1fr 1fr 1.25fr 1fr 1fr 1fr;align-items:stretch}
    .match-clock{min-height:58px;background:#0d0d0d;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;user-select:none}
    .match-clock .value{font-size:22px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
    .match-clock .sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
    .match-clock.off{opacity:.35}
    .reset-wrap{position:relative}
    .reset-ring{position:absolute;inset:4px;pointer-events:none}
    .reset-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
    .reset-ring circle{fill:none;stroke:rgba(255,255,255,.28);stroke-width:2.5}
    .reset-ring .progress{stroke:var(--red);stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .04s linear;filter:drop-shadow(0 0 6px rgba(239,68,68,.35))}
    .reset-btn.arming{box-shadow:0 0 0 2px rgba(239,68,68,.2) inset,0 0 18px rgba(239,68,68,.22);transform:scale(.97)}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.84);display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:30}
    .sheet,.settings,.history-sheet{width:min(100%,440px);padding:14px}
    .sheet-head,.settings-head,.history-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .title{font-size:22px;font-weight:800;letter-spacing:-.03em}
    .amount-display{min-height:96px;background:#0b0b0b;display:grid;place-items:center;margin-bottom:12px;padding:8px;border-radius:28px}
    .amount-display .big{font-size:54px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.05em;word-break:break-word}
    .keypad-hint{font-size:12px;color:var(--muted);text-align:center;margin:-2px 0 10px 0}
    .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
    .circle-btn{aspect-ratio:1/1;width:100%;display:grid;place-items:center;font-size:24px;font-weight:700;background:#121212}
    .confirm-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .confirm-btn,.cancel-btn{height:54px;font-weight:700;font-size:17px}
    .confirm-plus{background:var(--green);color:#04130a}
    .confirm-minus{background:var(--red);color:#fff}
    .cancel-btn{background:#181818;color:#fff}
    .settings-body{display:grid;gap:16px;max-height:70dvh;overflow:auto}
    .setting-block{display:grid;gap:8px}
    .setting-title{font-size:14px;color:#d5d5d5;font-weight:600}
    .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#0d0d0d;padding:12px 14px;border-radius:22px}
    .toggle{width:58px;height:34px;background:#1a1a1a;position:relative;cursor:pointer;border:none;border-radius:999px}
    .toggle::after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;top:4px;left:4px;background:#fff;transition:transform .18s ease}
    .toggle.on{background:var(--blue)}
    .toggle.on::after{transform:translateX(24px)}
    .segmented{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .ghost-btn{height:52px;background:#111;color:#fff;font-weight:700;border-radius:999px;border:none}
    .start-row{display:grid;grid-template-columns:1fr auto;gap:10px}
    .start-input{height:54px;background:#0c0c0c;color:#fff;text-align:center;font-size:22px;font-weight:700;outline:none;width:100%}
    .apply-btn{height:54px;padding:0 20px;background:#fff;color:#000;font-weight:700;font-size:16px}
    .tiny{font-size:12px;color:var(--muted);line-height:1.2}
    .inline-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
    .time-input{width:120px;height:52px;background:#0c0c0c;color:#fff;text-align:center;font-size:20px;font-weight:800;outline:none}
    .history-list{max-height:70dvh;overflow:auto;display:grid;gap:8px}
    .history-item{background:#0c0c0c;padding:12px 14px;border-radius:22px;display:grid;gap:4px}
    .history-item .topline{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#d9d9d9}
    .history-item .subline{font-size:12px;color:var(--muted)}
    .collapsed{display:none !important}
    .radial-overlay{position:fixed;inset:0;background:rgba(0,0,0,.16);z-index:40}
    .radial-stage{position:absolute;width:260px;height:260px;transform:translate(-50%,-50%);pointer-events:none}
    .radial-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
    .radial-path{stroke:rgba(255,255,255,.16);stroke-width:4;stroke-linecap:round;fill:none}
    .radial-path.active{stroke:rgba(59,130,246,.62)}
    .radial-center{position:absolute;left:50%;top:50%;width:72px;height:72px;transform:translate(-50%,-50%);border-radius:50%;background:#0b0b0b;color:var(--blue);box-shadow:0 0 0 2px rgba(59,130,246,.16) inset;display:grid;place-items:center;font-weight:800;font-size:22px;pointer-events:auto}
    .radial-center svg{width:24px;height:24px;display:block}
    .radial-item{position:absolute;left:50%;top:50%;width:78px;height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:#131313;color:#8c8c8c;transform:translate(var(--x), var(--y));pointer-events:auto;box-shadow:0 0 0 rgba(0,0,0,0)}
    .radial-item .t1{font-size:16px;font-weight:800;line-height:1}
    .radial-item .t2{font-size:10px;color:inherit;line-height:1}
    .radial-item.active{background:#fff;color:#000;box-shadow:0 0 0 2px rgba(255,255,255,.18) inset, 0 0 22px rgba(255,255,255,.18);transform:translate(var(--x), var(--y)) scale(1.08)}
    @keyframes floaty{0%,100%{transform:translate(var(--x), var(--y))}50%{transform:translate(var(--x), var(--y))}}
    @media (max-height:760px){
      .app{gap:6px;padding:6px}.panel-inner{padding:12px}.center{padding:8px}.lp{font-size:clamp(44px,12vw,82px)}
      .action-btn{height:min(18vw,82px);max-width:82px;font-size:30px}.mini-btn,.match-clock{min-height:52px}.radial-stage{width:232px;height:232px}.radial-item{width:72px;height:72px}.radial-center{width:66px;height:66px}
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel">
      <div class="panel-inner rotated" id="player0Inner">
        <div class="head">
          <div style="min-width:0;flex:1">
            <div class="label">Player</div>
            <input class="name-input" id="name0" value="Top Player" />
            <div class="lp" id="lp0">8000</div>
          </div>
          <button class="icon-btn" id="rotate0" aria-label="Rotate">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h7a5 5 0 0 1 5 5v5"/><path d="M15 18h3v-3"/></svg>
          </button>
        </div>
        <div class="controls">
          <button class="action-btn minus" id="minus0">−</button>
          <button class="action-btn actions-open" id="actions0" aria-label="Actions">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M3 12h18"/><path d="m7 7 10 10"/><path d="m17 7-10 10"/></svg>
          </button>
          <button class="action-btn plus" id="plus0">+</button>
        </div>
      </div>
    </section>

    <section class="center">
      <button class="mini-btn undo" id="undoBtn" aria-label="Undo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5 5 12l7 7 1.4-1.4L8.8 13H20v-2H8.8l4.6-4.6z"/></svg></button>
      <button class="mini-btn redo" id="redoBtn" aria-label="Redo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 5-1.4 1.4L15.2 11H4v2h11.2l-4.6 4.6L12 19l7-7z"/></svg></button>
      <button class="match-clock" id="matchClockBtn" aria-label="Match clock"><div class="value" id="matchClockValue">20:00</div><div class="sub" id="matchClockState">paused</div></button>
      <button class="mini-btn history-btn" id="historyBtn" aria-label="History"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 6h10"/><path d="M7 12h10"/><path d="M7 18h10"/></svg></button>
      <button class="mini-btn settings-btn" id="settingsBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1 1 0 0 0 .2 1.1l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1 1 0 0 0-1.1-.2 1 1 0 0 0-.6.9V20a2 2 0 1 1-4 0v-.2a1 1 0 0 0-.7-.9 1 1 0 0 0-1.1.2l-.1.1a2 2 0 0 1-2.8-2.8l.1-.1a1 1 0 0 0 .2-1.1 1 1 0 0 0-.9-.6H4a2 2 0 1 1 0-4h.2a1 1 0 0 0 .9-.7 1 1 0 0 0-.2-1.1l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1 1 0 0 0 1.1.2h.1a1 1 0 0 0 .6-.9V4a2 2 0 1 1 4 0v.2a1 1 0 0 0 .7.9 1 1 0 0 0 1.1-.2l.1-.1a2 2 0 0 1 2.8 2.8l-.1.1a1 1 0 0 0-.2 1.1v.1a1 1 0 0 0 .9.6H20a2 2 0 1 1 0 4h-.2a1 1 0 0 0-.9.7Z"/></svg></button>
      <div class="reset-wrap">
        <button class="mini-btn reset-btn" id="mainResetBtn" aria-label="Hold to reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h7a5 5 0 0 1 5 5v5"/><path d="M15 18h3v-3"/></svg></button>
        <div class="reset-ring"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28"></circle><circle class="progress" id="resetProgressCircle" cx="32" cy="32" r="28"></circle></svg></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-inner" id="player1Inner">
        <div class="head">
          <div style="min-width:0;flex:1">
            <div class="label">Player</div>
            <input class="name-input" id="name1" value="Bottom Player" />
            <div class="lp" id="lp1">8000</div>
          </div>
          <button class="icon-btn" id="rotate1" aria-label="Rotate">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h7a5 5 0 0 1 5 5v5"/><path d="M15 18h3v-3"/></svg>
          </button>
        </div>
        <div class="controls">
          <button class="action-btn minus" id="minus1">−</button>
          <button class="action-btn actions-open" id="actions1" aria-label="Actions">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M3 12h18"/><path d="m7 7 10 10"/><path d="m17 7-10 10"/></svg>
          </button>
          <button class="action-btn plus" id="plus1">+</button>
        </div>
      </div>
    </section>
  </main>

  <div class="overlay collapsed" id="keypadOverlay">
    <section class="sheet" id="keypadSheet">
      <div class="sheet-head"><div><div class="label" id="sheetPlayerLabel">Player 1</div><div class="title" id="sheetActionTitle">Add LP</div></div><button class="icon-btn" id="closeSheetBtn" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button></div>
      <div class="amount-display"><div class="big" id="keypadValue">0</div></div>
      <div class="keypad-hint" id="keypadHint">Last used value loaded. First tap replaces it.</div>
      <div class="keypad">
        <button class="circle-btn" data-key="1">1</button><button class="circle-btn" data-key="2">2</button><button class="circle-btn" data-key="3">3</button>
        <button class="circle-btn" data-key="4">4</button><button class="circle-btn" data-key="5">5</button><button class="circle-btn" data-key="6">6</button>
        <button class="circle-btn" data-key="7">7</button><button class="circle-btn" data-key="8">8</button><button class="circle-btn" data-key="9">9</button>
        <button class="circle-btn" data-key="00">00</button><button class="circle-btn" data-key="0">0</button><button class="circle-btn" data-key="back">⌫</button>
      </div>
      <div class="confirm-row"><button class="cancel-btn" id="cancelActionBtn">Cancel</button><button class="confirm-btn confirm-plus" id="confirmActionBtn">Confirm</button></div>
    </section>
  </div>

  <div class="radial-overlay collapsed" id="radialOverlay">
    <div class="radial-stage" id="radialStage">
      <svg class="radial-svg" viewBox="0 0 260 260"><line id="radialLine" x1="130" y1="130" x2="130" y2="130" class="radial-path"></line></svg>
      <button class="radial-center" id="radialCenterBtn" aria-label="Close actions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M3 12h18"/><path d="m7 7 10 10"/><path d="m17 7-10 10"/></svg></button>
      <button class="radial-item" data-radial-action="half" style="--x:-39px;--y:-102px;animation-delay:0s"><div class="t1">/2</div><div class="t2">half</div></button>
      <button class="radial-item" data-radial-action="plus1k" style="--x:37px;--y:-70px;animation-delay:.2s"><div class="t1">+1000</div><div class="t2">gain</div></button>
      <button class="radial-item" data-radial-action="upstart" style="--x:64px;--y:18px;animation-delay:.4s"><div class="t1">Upstart</div><div class="t2">opp +1000</div></button>
      <button class="radial-item" data-radial-action="duo" style="--x:-142px;--y:18px;animation-delay:.6s"><div class="t1">Duo</div><div class="t2">self -1000</div></button>
      <button class="radial-item" data-radial-action="rod" style="--x:-116px;--y:102px;animation-delay:.8s"><div class="t1">RoD</div><div class="t2">both -X</div></button>
    </div>
  </div>

  <div class="overlay collapsed" id="settingsOverlay">
    <section class="settings">
      <div class="settings-head"><div class="title">Settings</div><button class="icon-btn" id="closeSettingsBtn" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button></div>
      <div class="settings-body">
        <div class="setting-block">
          <div class="setting-title">Starting LP</div>
          <div class="segmented"><button class="ghost-btn" data-start="4000">4000</button><button class="ghost-btn" data-start="8000">8000</button><button class="ghost-btn" data-start="12000">12000</button><button class="ghost-btn" data-start="16000">16000</button></div>
          <div class="start-row"><input class="start-input" id="startingLpInput" inputmode="numeric" value="8000" /><button class="apply-btn" id="applyStartBtn">Apply</button></div>
        </div>
        <div class="setting-block">
          <div class="setting-title">Match clock</div>
          <div class="toggle-row"><div><div>Enable center countdown</div><div class="tiny">Tap the center clock to start or pause it.</div></div><button class="toggle on" id="matchClockToggle"></button></div>
          <div class="inline-row"><div class="tiny">Minutes</div><input class="time-input" id="matchMinutesInput" inputmode="numeric" value="20" /></div>
          <div class="segmented"><button class="ghost-btn" id="matchPauseBtn">Pause</button><button class="ghost-btn" id="matchResetBtn">Reset</button></div>
        </div>
      </div>
    </section>
  </div>

  <div class="overlay collapsed" id="historyOverlay">
    <section class="history-sheet">
      <div class="history-head"><div class="title">LP History</div><div style="display:flex;gap:8px"><button class="mini-btn history-btn" id="exportLogBtn" aria-label="Export log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></button><button class="icon-btn" id="closeHistoryBtn" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button></div></div>
      <div class="history-list" id="historyList"></div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = "ygo_lp_tracker_v9_state";
    const PREFS_KEY = "ygo_lp_tracker_v9_prefs";
    const RESET_HOLD_MS = 400;
    const DEFAULT_PREFS = () => ({startingLP:8000,matchClockEnabled:true,matchMinutes:20,playerNames:["Top Player","Bottom Player"],lastAmounts:[500,500],lastRodAmount:500});
    const DEFAULT_STATE = (prefs) => ({players:[{lp:prefs.startingLP,rotation:180},{lp:prefs.startingLP,rotation:0}],matchClockSeconds:prefs.matchMinutes*60,matchClockRunning:false,lpHistory:[]});

    let prefs = loadPrefs() || DEFAULT_PREFS();
    let state = loadState() || DEFAULT_STATE(prefs);
    if (state && state.players) { state.players.forEach((p, idx) => { if (typeof p.rotation !== "number") p.rotation = p.rotated ? 180 : 0; }); }
    if (state && state.players) {
      state.players.forEach((p, idx) => {
        if (typeof p.rotation !== "number") {
          p.rotation = p.rotated ? 180 : 0;
        }
      });
    }
    let lpUndo = [], lpRedo = [], matchTimerId = null, pendingAction = null;
    let resetHoldTimeout = null, resetAnimFrame = null, resetStartTime = 0;
    let radialState = {open:false,playerIndex:0,sticky:false,dragging:false,startX:0,startY:0,activeAction:null,centerX:0,centerY:0};

    const lpEls=[document.getElementById("lp0"),document.getElementById("lp1")];
    const nameEls=[document.getElementById("name0"),document.getElementById("name1")];
    const innerEls=[document.getElementById("player0Inner"),document.getElementById("player1Inner")];
    const undoBtn=document.getElementById("undoBtn"), redoBtn=document.getElementById("redoBtn"), resetBtn=document.getElementById("mainResetBtn");
    const resetProgress=document.getElementById("resetProgressCircle");
    const matchClockBtn=document.getElementById("matchClockBtn"), matchClockValue=document.getElementById("matchClockValue"), matchClockState=document.getElementById("matchClockState");
    const startingLpInput=document.getElementById("startingLpInput"), matchClockToggle=document.getElementById("matchClockToggle"), matchMinutesInput=document.getElementById("matchMinutesInput");
    const historyList=document.getElementById("historyList"), keypadHint=document.getElementById("keypadHint");
    const radialOverlay=document.getElementById("radialOverlay"), radialStage=document.getElementById("radialStage"), radialLine=document.getElementById("radialLine"), radialItems=[...document.querySelectorAll(".radial-item")], radialCenterBtn=document.getElementById("radialCenterBtn");
    const RESET_CIRC = 2 * Math.PI * 28;
    resetProgress.style.strokeDasharray = String(RESET_CIRC);
    resetProgress.style.strokeDashoffset = String(RESET_CIRC);
    const radialPos = {half:{x:91,y:28},plus1k:{x:167,y:60},upstart:{x:194,y:148},duo:{x:48,y:148},rod:{x:74,y:232}};

    function savePrefs(){localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));}
    function loadPrefs(){try{const raw=localStorage.getItem(PREFS_KEY);return raw?JSON.parse(raw):null;}catch{return null;}}
    function saveState(){localStorage.setItem(STORAGE_KEY, JSON.stringify(state));}
    function loadState(){try{const raw=localStorage.getItem(STORAGE_KEY);return raw?JSON.parse(raw):null;}catch{return null;}}
    function clone(v){return JSON.parse(JSON.stringify(v));}
    function sanitizeInt(value,fallback=0){const n=parseInt(String(value).replace(/[^0-9]/g,""),10);return Number.isFinite(n)?n:fallback;}
    function formatTime(totalSeconds){const safe=Math.max(0,totalSeconds|0);const mins=Math.floor(safe/60);const secs=safe%60;return String(mins).padStart(2,"0")+":"+String(secs).padStart(2,"0");}
    function stamp(){return new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", second:"2-digit"});}
    function pushLPUndo(){lpUndo.push({players:clone(state.players),lpHistory:clone(state.lpHistory)});if(lpUndo.length>100)lpUndo.shift();lpRedo=[];}
    function animateLP(i){const el=lpEls[i];el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump");}
    function renderHistory(){historyList.innerHTML="";if(!state.lpHistory.length){const div=document.createElement("div");div.className="history-item";div.innerHTML='<div class="topline"><span>No LP changes yet</span></div>';historyList.appendChild(div);return;}[...state.lpHistory].reverse().forEach(entry=>{const div=document.createElement("div");div.className="history-item";div.innerHTML=`<div class="topline"><span>${entry.title}</span><span>${entry.time}</span></div><div class="subline">${entry.detail}</div>`;historyList.appendChild(div);});}
    function resetMatchClock(){state.matchClockSeconds=Math.max(1,sanitizeInt(prefs.matchMinutes,20))*60;state.matchClockRunning=false;}
    function syncMatchClock(){if(matchTimerId){clearInterval(matchTimerId);matchTimerId=null;}if(prefs.matchClockEnabled&&state.matchClockRunning){matchTimerId=setInterval(()=>{state.matchClockSeconds=Math.max(0,state.matchClockSeconds-1);if(state.matchClockSeconds<=0)state.matchClockRunning=false;render();saveState();if(!state.matchClockRunning)syncMatchClock();},1000);}}
    function render(){lpEls[0].textContent=state.players[0].lp;lpEls[1].textContent=state.players[1].lp;innerEls[0].classList.toggle("rotated",!!state.players[0].rotated);innerEls[1].classList.toggle("rotated",!!state.players[1].rotated);nameEls[0].value=prefs.playerNames[0]||"Top Player";nameEls[1].value=prefs.playerNames[1]||"Bottom Player";startingLpInput.value=prefs.startingLP;matchMinutesInput.value=prefs.matchMinutes;matchClockToggle.classList.toggle("on",!!prefs.matchClockEnabled);matchClockValue.textContent=prefs.matchClockEnabled?formatTime(state.matchClockSeconds):"--:--";matchClockState.textContent=!prefs.matchClockEnabled?"disabled":state.matchClockRunning?"running":"paused";matchClockBtn.classList.toggle("off",!prefs.matchClockEnabled);undoBtn.classList.toggle("disabled",lpUndo.length===0);redoBtn.classList.toggle("disabled",lpRedo.length===0);renderHistory();}
    function addHistory(title,detail){state.lpHistory.push({title,detail,time:stamp()});}
    function applyLPDelta(playerIndex,amount,label){pushLPUndo();const before=state.players[playerIndex].lp;state.players[playerIndex].lp=Math.max(0,before+amount);prefs.lastAmounts[playerIndex]=Math.abs(amount)||prefs.lastAmounts[playerIndex];addHistory(label,`${prefs.playerNames[playerIndex]}: ${before} → ${state.players[playerIndex].lp}`);savePrefs();saveState();animateLP(playerIndex);render();}
    function applyHalf(playerIndex){pushLPUndo();const before=state.players[playerIndex].lp;state.players[playerIndex].lp=Math.floor(before/2);addHistory(`${prefs.playerNames[playerIndex]} /2`,`${before} → ${state.players[playerIndex].lp}`);saveState();animateLP(playerIndex);render();}
    function openKeypad(actionType,playerIndex=null){const preload=actionType==="rod"?Math.max(0,sanitizeInt(prefs.lastRodAmount,500)):Math.max(0,sanitizeInt((prefs.lastAmounts||[500,500])[playerIndex],500));pendingAction={actionType,playerIndex,value:String(preload),fresh:true};if(actionType==="rod"){document.getElementById("sheetPlayerLabel").textContent="Both Players";document.getElementById("sheetActionTitle").textContent="Ring of Destruction";document.getElementById("confirmActionBtn").className="confirm-btn confirm-minus";document.getElementById("keypadSheet").style.transform="rotate(0deg)";keypadHint.textContent="Both players lose the entered amount.";}else{document.getElementById("sheetPlayerLabel").textContent=prefs.playerNames[playerIndex]||("Player "+(playerIndex+1));document.getElementById("sheetActionTitle").textContent=actionType==="add"?"Add LP":"Subtract LP";document.getElementById("confirmActionBtn").className="confirm-btn "+(actionType==="add"?"confirm-plus":"confirm-minus");document.getElementById("keypadSheet").style.transform=`rotate(${state.players[playerIndex].rotated?180:0}deg)`;keypadHint.textContent=`Last used value loaded for ${prefs.playerNames[playerIndex]||("Player "+(playerIndex+1))}. First tap replaces it.`;}updateKeypadValue();document.getElementById("keypadOverlay").classList.remove("collapsed");}
    function closeKeypad(){pendingAction=null;document.getElementById("keypadOverlay").classList.add("collapsed");}
    function updateKeypadValue(){document.getElementById("keypadValue").textContent=pendingAction&&pendingAction.value?pendingAction.value:"0";}
    function keypadPress(key){if(!pendingAction)return;if(key==="back"){pendingAction.value=pendingAction.fresh?"":pendingAction.value.slice(0,-1);pendingAction.fresh=false;}else{if(pendingAction.fresh)pendingAction.value=key==="00"?"0":key;else pendingAction.value=(pendingAction.value+key).replace(/^0+(?=[0-9])/,"").slice(0,6);pendingAction.fresh=false;}updateKeypadValue();}
    function confirmAction(){if(!pendingAction)return;const amount=sanitizeInt(pendingAction.value,0);if(amount<=0)return;if(pendingAction.actionType==="rod"){pushLPUndo();const b0=state.players[0].lp,b1=state.players[1].lp;state.players[0].lp=Math.max(0,b0-amount);state.players[1].lp=Math.max(0,b1-amount);prefs.lastRodAmount=amount;addHistory(`Ring of Destruction -${amount}`,`${prefs.playerNames[0]}: ${b0} → ${state.players[0].lp} • ${prefs.playerNames[1]}: ${b1} → ${state.players[1].lp}`);savePrefs();saveState();animateLP(0);animateLP(1);render();}else{const i=pendingAction.playerIndex;const sign=pendingAction.actionType==="add"?1:-1;applyLPDelta(i,sign*amount,`${prefs.playerNames[i]} ${sign>0?"+":"-"}${amount}`);}closeKeypad();}
    function openRadial(playerIndex,centerEl,startX=null,startY=null){const rect=centerEl.getBoundingClientRect();radialState.open=true;radialState.playerIndex=playerIndex;radialState.sticky=false;radialState.dragging=startX!==null&&startY!==null;radialState.startX=startX||rect.left+rect.width/2;radialState.startY=startY||rect.top+rect.height/2;radialState.activeAction=null;radialState.centerX=rect.left+rect.width/2;radialState.centerY=rect.top+rect.height/2;radialStage.style.left=`${radialState.centerX}px`;radialStage.style.top=`${radialState.centerY}px`;radialOverlay.classList.remove("collapsed");setRadialActive(null);}
    function closeRadial(){radialState.open=false;radialState.dragging=false;radialState.sticky=false;radialState.activeAction=null;radialOverlay.classList.add("collapsed");setRadialActive(null);}
    function setRadialActive(action){radialState.activeAction=action;radialItems.forEach(item=>item.classList.toggle("active",item.dataset.radialAction===action));if(!action){radialLine.classList.remove("active");radialLine.setAttribute("x2","130");radialLine.setAttribute("y2","130");return;}const p=radialPos[action];radialLine.classList.add("active");radialLine.setAttribute("x2",String(p.x));radialLine.setAttribute("y2",String(p.y));}
    function nearestAction(clientX,clientY){const rect=radialStage.getBoundingClientRect();const lx=clientX-rect.left,ly=clientY-rect.top;let best=null,bestDist=Infinity;for(const [action,p] of Object.entries(radialPos)){const dx=lx-p.x,dy=ly-p.y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<bestDist){bestDist=dist;best=action;}}return bestDist<48?best:null;}
    function triggerRadialAction(action,playerIndex){if(!action)return;closeRadial();if(action==="half")applyHalf(playerIndex);else if(action==="plus1k")applyLPDelta(playerIndex,1000,`${prefs.playerNames[playerIndex]} +1000`);else if(action==="upstart"){const target=playerIndex===0?1:0;applyLPDelta(target,1000,`Upstart Goblin → ${prefs.playerNames[target]} +1000`);}else if(action==="duo")applyLPDelta(playerIndex,-1000,`Delinquent Duo → ${prefs.playerNames[playerIndex]} -1000`);else if(action==="rod")openKeypad("rod");}
    function onRadialPointerMove(e){if(!radialState.open||!radialState.dragging)return;const dx=e.clientX-radialState.startX,dy=e.clientY-radialState.startY,dist=Math.sqrt(dx*dx+dy*dy);if(dist<18){setRadialActive(null);return;}setRadialActive(nearestAction(e.clientX,e.clientY));}
    function onRadialPointerUp(e){if(!radialState.open)return;window.removeEventListener("pointermove",onRadialPointerMove);window.removeEventListener("pointerup",onRadialPointerUp);const dx=e.clientX-radialState.startX,dy=e.clientY-radialState.startY,dist=Math.sqrt(dx*dx+dy*dy);if(radialState.dragging&&dist<18){radialState.sticky=true;radialState.dragging=false;return;}if(radialState.activeAction)triggerRadialAction(radialState.activeAction,radialState.playerIndex);else closeRadial();}
    function performReset(){state.players[0].lp=prefs.startingLP;state.players[1].lp=prefs.startingLP;resetMatchClock();syncMatchClock();saveState();animateLP(0);animateLP(1);render();}
    function setResetProgress(progress){const offset=RESET_CIRC*(1-Math.max(0,Math.min(1,progress)));resetProgress.style.strokeDashoffset=String(offset);}
    function stepResetAnimation(now){const progress=Math.min(1,(now-resetStartTime)/RESET_HOLD_MS);setResetProgress(progress);if(progress<1&&resetHoldTimeout)resetAnimFrame=requestAnimationFrame(stepResetAnimation);}
    function startResetHold(){cancelResetHold();resetBtn.classList.add("arming");resetStartTime=performance.now();setResetProgress(0);resetAnimFrame=requestAnimationFrame(stepResetAnimation);resetHoldTimeout=setTimeout(()=>{performReset();cancelResetHold();},RESET_HOLD_MS);}
    function cancelResetHold(){if(resetHoldTimeout){clearTimeout(resetHoldTimeout);resetHoldTimeout=null;}if(resetAnimFrame){cancelAnimationFrame(resetAnimFrame);resetAnimFrame=null;}setResetProgress(0);resetBtn.classList.remove("arming");}
    function exportLog(){const lines=[];lines.push("Yu-Gi-Oh LP Tracker Log");lines.push(`Player 1: ${prefs.playerNames[0]}`);lines.push(`Player 2: ${prefs.playerNames[1]}`);lines.push("");if(!state.lpHistory.length)lines.push("No LP changes recorded.");state.lpHistory.forEach((entry,i)=>lines.push(`${i+1}. ${entry.time} | ${entry.title} | ${entry.detail}`));const blob=new Blob([lines.join("\\n")],{type:"text/plain;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="ygo-lp-log.txt";a.click();URL.revokeObjectURL(url);}

    document.getElementById("minus0").addEventListener("click",()=>openKeypad("subtract",0));
    document.getElementById("plus0").addEventListener("click",()=>openKeypad("add",0));
    document.getElementById("minus1").addEventListener("click",()=>openKeypad("subtract",1));
    document.getElementById("plus1").addEventListener("click",()=>openKeypad("add",1));

    function bindRadialButton(btn,playerIndex){btn.addEventListener("pointerdown",(e)=>{e.preventDefault();openRadial(playerIndex,btn,e.clientX,e.clientY);window.addEventListener("pointermove",onRadialPointerMove);window.addEventListener("pointerup",onRadialPointerUp,{once:false});});}
    bindRadialButton(document.getElementById("actions0"),0);
    bindRadialButton(document.getElementById("actions1"),1);

    radialItems.forEach(item=>{item.addEventListener("pointerenter",()=>{if(radialState.sticky)setRadialActive(item.dataset.radialAction);});item.addEventListener("click",()=>{if(radialState.sticky)triggerRadialAction(item.dataset.radialAction,radialState.playerIndex);});});
    radialCenterBtn.addEventListener("click",()=>closeRadial());
    radialOverlay.addEventListener("click",(e)=>{if(e.target===radialOverlay)closeRadial();});

    document.getElementById("rotate0").addEventListener("click",()=>{const cur = typeof state.players[0].rotation === "number" ? state.players[0].rotation : (state.players[0].rotated ? 180 : 0); state.players[0].rotation = (cur + 90) % 360; saveState(); render();});
    document.getElementById("rotate1").addEventListener("click",()=>{const cur = typeof state.players[1].rotation === "number" ? state.players[1].rotation : (state.players[1].rotated ? 180 : 0); state.players[1].rotation = (cur + 90) % 360; saveState(); render();});
    nameEls.forEach((el,idx)=>{el.addEventListener("change",()=>{prefs.playerNames[idx]=el.value.trim()||(idx===0?"Top Player":"Bottom Player");savePrefs();render();});});
    document.querySelectorAll("[data-key]").forEach(btn=>btn.addEventListener("click",()=>keypadPress(btn.dataset.key)));
    document.getElementById("confirmActionBtn").addEventListener("click",confirmAction);
    document.getElementById("cancelActionBtn").addEventListener("click",closeKeypad);
    document.getElementById("closeSheetBtn").addEventListener("click",closeKeypad);
    undoBtn.addEventListener("click",()=>{if(!lpUndo.length)return;lpRedo.push({players:clone(state.players),lpHistory:clone(state.lpHistory)});const prev=lpUndo.pop();state.players=prev.players;state.lpHistory=prev.lpHistory;saveState();animateLP(0);animateLP(1);render();});
    redoBtn.addEventListener("click",()=>{if(!lpRedo.length)return;lpUndo.push({players:clone(state.players),lpHistory:clone(state.lpHistory)});const next=lpRedo.pop();state.players=next.players;state.lpHistory=next.lpHistory;saveState();animateLP(0);animateLP(1);render();});
    matchClockBtn.addEventListener("click",()=>{if(!prefs.matchClockEnabled)return;state.matchClockRunning=!state.matchClockRunning;syncMatchClock();saveState();render();});
    document.getElementById("historyBtn").addEventListener("click",()=>document.getElementById("historyOverlay").classList.remove("collapsed"));
    document.getElementById("closeHistoryBtn").addEventListener("click",()=>document.getElementById("historyOverlay").classList.add("collapsed"));
    document.getElementById("exportLogBtn").addEventListener("click",exportLog);
    document.getElementById("settingsBtn").addEventListener("click",()=>document.getElementById("settingsOverlay").classList.remove("collapsed"));
    document.getElementById("closeSettingsBtn").addEventListener("click",()=>document.getElementById("settingsOverlay").classList.add("collapsed"));
    resetBtn.addEventListener("pointerdown",startResetHold);
    ["pointerup","pointerleave","pointercancel"].forEach(ev=>resetBtn.addEventListener(ev,cancelResetHold));
    document.getElementById("applyStartBtn").addEventListener("click",()=>{prefs.startingLP=Math.max(1,sanitizeInt(startingLpInput.value,8000));state.players[0].lp=prefs.startingLP;state.players[1].lp=prefs.startingLP;savePrefs();saveState();animateLP(0);animateLP(1);render();document.getElementById("settingsOverlay").classList.add("collapsed");});
    document.querySelectorAll("[data-start]").forEach(btn=>btn.addEventListener("click",()=>{startingLpInput.value=btn.dataset.start;}));
    matchClockToggle.addEventListener("click",()=>{prefs.matchClockEnabled=!prefs.matchClockEnabled;if(!prefs.matchClockEnabled)state.matchClockRunning=false;syncMatchClock();savePrefs();saveState();render();});
    matchMinutesInput.addEventListener("change",()=>{prefs.matchMinutes=Math.max(1,sanitizeInt(matchMinutesInput.value,20));resetMatchClock();syncMatchClock();savePrefs();saveState();render();});
    document.getElementById("matchPauseBtn").addEventListener("click",()=>{state.matchClockRunning=false;syncMatchClock();saveState();render();});
    document.getElementById("matchResetBtn").addEventListener("click",()=>{resetMatchClock();syncMatchClock();saveState();render();});
    document.getElementById("settingsOverlay").addEventListener("click",(e)=>{if(e.target.id==="settingsOverlay")document.getElementById("settingsOverlay").classList.add("collapsed");});
    document.getElementById("historyOverlay").addEventListener("click",(e)=>{if(e.target.id==="historyOverlay")document.getElementById("historyOverlay").classList.add("collapsed");});
    document.getElementById("keypadOverlay").addEventListener("click",(e)=>{if(e.target.id==="keypadOverlay")closeKeypad();});

    if(!state.matchClockSeconds)resetMatchClock();
    if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));}
    render(); syncMatchClock();
  </script>
</body>
</html>
